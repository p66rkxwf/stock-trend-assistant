[project]
name = "stockta"
version = "0.1.0"
description = "台股趨勢預測與投資助理系統"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "slowapi>=0.1.9",
    # Windows 的 zoneinfo 不含 IANA 時區資料庫，需靠此套件補上
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stockta*"]

[tool.pytest.ini_options]
# 這台機器上全域 %TEMP%\pytest-of-<user> 有一個舊資料夾權限被鎖住（存取被拒），
# 改用專案內的暫存目錄，避開該目錄，不需要去動/刪那個來源不明的系統暫存資料夾
addopts = "--basetemp=.pytest_tmp"
