# 洩漏回歸測試 CI。
#
# ⚠️ 誠實聲明：本 repo 目前**沒有任何 git remote**，這個 workflow 從未在遠端執行過。
# 它進版控是為了「日後推上遠端即生效」，不是既成事實。現在真正在把關的是
# scripts/githooks/pre-push（本機 pre-push hook，安裝方式見 scripts/install_hooks.ps1）。
# 在報告或簡報裡不得把這個檔案說成「已有 CI 在跑」。
name: leakage

on:
  push:
  pull_request:

jobs:
  leakage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝相依（CPU 版 torch，CI 不需要 GPU）
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: 打亂標籤測試與無前視偏差測試
        run: python -m pytest -m leakage -v
